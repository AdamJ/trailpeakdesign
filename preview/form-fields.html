<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Peak Design — Form Fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
body { padding: var(--space-6); }
form { max-width: 360px; }
</style>
</head>
<body class="tp-page">
<form class="tp-stack" action="#">
  <label class="tp-field">Name
    <input class="tp-input" type="text" name="name" placeholder="Adam J.">
  </label>
  <label class="tp-field">Message
    <textarea class="tp-input" name="message" rows="3" placeholder="Tell me about the project..."></textarea>
  </label>
  <label class="tp-field">Email
    <input class="tp-input" type="email" name="email" value="not-an-email" aria-invalid="true" aria-describedby="email-error">
    <span class="tp-error" id="email-error" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i>Enter a valid email address.</span>
  </label>
  <label class="tp-field">Project type
    <select class="tp-input" name="type"><option>Design system</option><option>iOS app</option><option>Marketing site</option></select>
  </label>
  <label class="tp-check"><input type="checkbox" checked> Send me occasional updates</label>
</form>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</body>
</html>
