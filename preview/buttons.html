<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Peak Design — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
body { padding: var(--space-6); }
.lbl { font-family: var(--font-code); font-size: var(--fs-12); color: var(--fg-secondary); min-width: 100px; }
.tag { font-family: var(--font-code); font-size: var(--fs-12); color: var(--fg-secondary); margin-left: var(--space-1); }
</style>
</head>
<body class="tp-page">
<div class="tp-stack">
  <div class="tp-row"><span class="lbl">primary</span><button class="tp-btn tp-btn--primary" type="button">Button</button><button class="tp-btn tp-btn--primary is-hover" type="button">Hover</button><span class="tag">4px border · shadow shifts</span></div>
  <div class="tp-row"><span class="lbl">secondary</span><button class="tp-btn tp-btn--secondary" type="button">Button</button><button class="tp-btn tp-btn--secondary is-hover" type="button">Hover</button><span class="tag">4px border · shadow shifts</span></div>
  <div class="tp-row"><span class="lbl">outline</span><button class="tp-btn tp-btn--outline" type="button">Button</button><button class="tp-btn tp-btn--outline is-hover" type="button">Hover</button></div>
  <div class="tp-row"><span class="lbl">danger</span><button class="tp-btn tp-btn--danger" type="button">Delete</button><button class="tp-btn tp-btn--danger is-hover" type="button">Hover</button><span class="tag">4px border · shadow shifts</span></div>
  <div class="tp-row"><span class="lbl">icon</span>
    <button class="tp-btn tp-btn--icon" type="button" aria-label="Scroll to top"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
    <button class="tp-btn tp-btn--icon is-hover" type="button" aria-label="Scroll to top"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
    <span class="tag">4px border</span>
  </div>
  <div class="tp-row"><span class="lbl">social</span>
    <button class="tp-btn tp-btn--social" type="button"><i class="ph-fill ph-twitter-logo" aria-hidden="true"></i>Follow</button>
    <button class="tp-btn tp-btn--social is-hover" type="button"><i class="ph-fill ph-twitter-logo" aria-hidden="true"></i>Hover</button>
    <span class="tag">4px border · moss → ember on hover</span>
  </div>
</div>
</body>
</html>
