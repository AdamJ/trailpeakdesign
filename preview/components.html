<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Peak Design — Components</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
.wrap { padding: var(--space-6); }
</style>
</head>
<body class="tp-page">
<div class="wrap tp-container">
  <section class="tp-stack">
    <h1 class="tp-h3">Light</h1>
    <div class="tp-row">
      <button class="tp-btn tp-btn--primary" type="button">Save</button>
      <button class="tp-btn tp-btn--secondary" type="button">Cancel</button>
      <button class="tp-btn tp-btn--danger" type="button">Delete account</button>
    </div>
    <form class="tp-card tp-stack" action="#">
      <label class="tp-field">Name
        <input class="tp-input" type="text" name="name" placeholder="Adam J.">
      </label>
      <label class="tp-field">Email
        <input class="tp-input" type="email" name="email" value="not-an-email" aria-invalid="true" aria-describedby="email-error-light">
        <span class="tp-error" id="email-error-light" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i>Enter a valid email address.</span>
      </label>
      <label class="tp-field">Bio
        <textarea class="tp-input" name="bio" rows="3"></textarea>
        <span class="tp-hint">A sentence or two.</span>
      </label>
      <label class="tp-check"><input type="checkbox" checked> Send me occasional updates</label>
      <button class="tp-btn tp-btn--primary" type="submit">Save</button>
    </form>
  </section>

  <section class="dark tp-page tp-stack" style="margin-top: var(--space-8); padding: var(--space-6);">
    <h2 class="tp-h3">Dark</h2>
    <div class="tp-row">
      <button class="tp-btn tp-btn--primary" type="button">Save</button>
      <button class="tp-btn tp-btn--secondary" type="button">Cancel</button>
      <button class="tp-btn tp-btn--danger" type="button">Delete account</button>
    </div>
    <form class="tp-card tp-stack" action="#">
      <label class="tp-field">Name
        <input class="tp-input" type="text" name="name-dark" placeholder="Adam J.">
      </label>
      <label class="tp-field">Email
        <input class="tp-input" type="email" name="email-dark" value="not-an-email" aria-invalid="true" aria-describedby="email-error-dark">
        <span class="tp-error" id="email-error-dark" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i>Enter a valid email address.</span>
      </label>
      <label class="tp-field">Bio
        <textarea class="tp-input" name="bio-dark" rows="3"></textarea>
        <span class="tp-hint">A sentence or two.</span>
      </label>
      <label class="tp-check"><input type="checkbox" checked> Send me occasional updates</label>
      <button class="tp-btn tp-btn--primary" type="submit">Save</button>
    </form>
  </section>
</div>
</body>
</html>
