name: Design token check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Check for new hardcoded design values
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-design-tokens.mjs

      - name: Check token contrast (light and dark)
        run: node scripts/check-token-contrast.mjs

      - name: Lint components.css and check generated files are current
        run: |
          node scripts/build-tokens-json.mjs
          node scripts/build-components-json.mjs
          git diff --exit-code tokens.json components.json CLAUDE.md
