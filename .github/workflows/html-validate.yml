name: HTML validate

on:
  pull_request:
    paths:
      - 'preview/**/*.html'
      - 'social/**/*.html'

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run html-validate
        run: npx --yes html-validate "preview/**/*.html" "social/**/*.html"
