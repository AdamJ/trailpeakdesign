name: Release

on:
  push:
    tags:
      - "20*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to the build id in VERSION)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          [ -n "$TAG" ] || TAG="$(cat VERSION)"
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "invalid tag" >&2; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Regenerate tokens.json and components.json
        run: |
          node scripts/build-tokens-json.mjs
          node scripts/build-components-json.mjs

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          zip -r "dist/trail-peak-${TAG}.zip" \
            colors_and_type.css components.css components.json tokens.json llms.txt \
            fonts assets shadcn/theme.css shadcn/README.md \
            README.md CLAUDE.md CONTRIBUTING.md
          cp colors_and_type.css components.css components.json tokens.json dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Trail Peak ${TAG}" \
            --generate-notes
