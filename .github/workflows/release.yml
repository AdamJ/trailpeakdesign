name: Release

on:
  push:
    tags:
      - "20*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to the build id in VERSION)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
            [ -n "$TAG" ] || TAG="$(cat VERSION)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Regenerate tokens.json and components.json
        run: |
          node scripts/build-tokens-json.mjs
          node scripts/build-components-json.mjs

      - name: Package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          zip -r "dist/trail-peak-${TAG}.zip" \
            colors_and_type.css components.css components.json tokens.json llms.txt \
            fonts assets shadcn/theme.css shadcn/README.md \
            README.md CLAUDE.md CONTRIBUTING.md
          cp colors_and_type.css components.css components.json tokens.json dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Trail Peak ${TAG}" \
            --generate-notes
