name: Markdown lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'preview/**'

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: cspell
        run: npx --yes cspell --no-progress "**/*.md"

      - name: PREVIEWS.md sync check
        run: node scripts/check-previews-index.mjs
